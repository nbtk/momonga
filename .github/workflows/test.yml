name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: python -m pip install .

      - name: Run the unit tests
        run: python -m unittest tests/test_*.py

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check the source
        run: >
          ruff check --target-version py311
          --select F,E4,E7,E9,W,B,UP
          --ignore UP031
          momonga/

  typing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package the way a caller would get it
        run: |
          python -m pip install build mypy
          python -m build
          python -m pip install dist/*.whl

      - name: Check from outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/asacaller"
          cp tests/typing/*.py "$RUNNER_TEMP/asacaller/"

      - name: A caller running --strict sees the annotations
        working-directory: ${{ runner.temp }}/asacaller
        run: mypy --strict consumer.py

      - name: And is told when the types are wrong
        working-directory: ${{ runner.temp }}/asacaller
        run: |
          mypy --strict consumer_mistakes.py > out.txt 2>&1 || true
          cat out.txt
          grep -q 'Found 4 errors' out.txt
